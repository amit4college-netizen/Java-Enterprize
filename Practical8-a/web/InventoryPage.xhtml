<?xml version="1.0" encoding="UTF-8"?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Inventory Application</title>
    </h:head>

    <h:body>

        <h1>Inventory Management</h1>

        <h:form>

            Product Name:
            <h:inputText value="#{inventory.name}"/>

            <br/><br/>

            Category:
            <h:inputText value="#{inventory.category}"/>

            <br/><br/>

            Quantity:
            <h:inputText value="#{inventory.quantity}"/>

            <br/><br/>

            Price:
            <h:inputText value="#{inventory.price}"/>

            <br/><br/>

            <h:commandButton value="Add Product"
                             action="#{inventory.save}"/>

            <br/><br/>

            <h2>Product List</h2>

            <h:dataTable value="#{inventory.products}"
                         var="p" border="1">

                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{p.id}
                </h:column>

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{p.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Category</f:facet>
                    #{p.category}
                </h:column>

                <h:column>
                    <f:facet name="header">Quantity</f:facet>
                    #{p.quantity}
                </h:column>

                <h:column>
                    <f:facet name="header">Price</f:facet>
                    #{p.price}
                </h:column>

            </h:dataTable>

        </h:form>

    </h:body>

</html>
