<html>
    <head>
        <title>Calculator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form action="Calculator">
            Enter number 1 : <input type="text" name="txt1" value="" /><br><br>
            Enter number 2 : <input type="text" name="txt2" value="" /><br><br>
            <input type="radio" name="operator" value="+" />Addition<br><br>

            <input type="radio" name="operator" value="*" />Multiplication<br><br>
            <input type="radio" name="operator" value="/" />Division<br><br>

        </form>
